# Forced light theme with a single cohesive palette (fresh emerald + greens).
# Forcing base="light" also fixes the white-on-white issue that appears when
# Streamlit auto-switches to dark mode under custom light CSS.
[theme]
base = "light"
primaryColor = "#1E7A4B"              # living emerald — the single accent
backgroundColor = "#F1F5EF"           # fresh whisper-green ivory (app background)
secondaryBackgroundColor = "#FFFFFF"  # surfaces: cards, sidebar, inputs
textColor = "#15251B"                 # deep forest charcoal
font = "sans serif"

[client]
toolbarMode = "minimal"

[ui]
hideTopBar = true
