name: Fly Deploy

# Auto-deploys to Fly.io on push to main — but ONLY if a FLY_API_TOKEN repo
# secret is configured. Without it, the job skips cleanly (green ✓) instead of
# failing, so the workflow stays "ready to deploy" without red X's.
#
# To enable real deploys:
#   1) flyctl tokens create deploy
#   2) GitHub repo → Settings → Secrets and variables → Actions → New secret
#      name: FLY_API_TOKEN
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-group   # never run two deploys at once
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Fly.io token
        id: guard
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN not set — skipping deploy. Add the secret to enable auto-deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up flyctl
        if: steps.guard.outputs.enabled == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: steps.guard.outputs.enabled == 'true'
        run: flyctl deploy --remote-only
